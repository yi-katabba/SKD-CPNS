name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest; cukup terima lisensinya
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cek secrets signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ]  && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ]  && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ]  && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum terbaca di repo ini ($GITHUB_REPOSITORY):$missing. Pastikan dibuat di Settings > Secrets and variables > Actions > Repository secrets (bukan Variables / Environment), dengan nama persis sama."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore OK: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      - name: Install dependencies
        run: npm install

      - name: Siapkan aset web (www) + nomor build
        run: npm run prepare-www
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Buat proyek Android
        run: npx cap add android

      - name: Generate ikon & splash
        run: npx capacitor-assets generate --android

      - name: Sync aset web ke Android
        run: npx cap sync android

      - name: Patch versi & signing
        run: node scripts/patch-android.js
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK release (ditandatangani)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SKD-CPNS.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKD-CPNS-apk
          path: SKD-CPNS.apk

      - name: Publish ke GitHub Releases (push ke main/master)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SKD CPNS build ${{ github.run_number }}
          make_latest: true
          files: SKD-CPNS.apk
