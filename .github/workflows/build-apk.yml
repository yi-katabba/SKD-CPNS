name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cek secrets signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi. Lihat README-ANDROID.md (langkah signing). Tanpa kunci tetap, APK baru tidak bisa menimpa versi lama."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Install dependencies
        run: npm install

      - name: Siapkan aset web (www) + nomor build
        run: npm run prepare-www
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Buat proyek Android
        run: npx cap add android

      - name: Generate ikon & splash
        run: npx capacitor-assets generate --android

      - name: Sync aset web ke Android
        run: npx cap sync android

      - name: Patch versi & signing
        run: node scripts/patch-android.js
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK release (ditandatangani)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SKD-CPNS.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKD-CPNS-apk
          path: SKD-CPNS.apk

      - name: Publish ke GitHub Releases (push ke main/master)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SKD CPNS build ${{ github.run_number }}
          make_latest: true
          files: SKD-CPNS.apk
